<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Simple Todo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="page-header">
          <p class="eyebrow">Your day, in focus</p>
          <h1 id="page-title">Things to do</h1>
          <p class="intro">Add what matters, then check it off when it is done.</p>
        </header>

        <form class="todo-form" id="todo-form">
          <label for="task-description">Task description</label>
          <div class="composer">
            <input
              id="task-description"
              name="description"
              type="text"
              placeholder="What needs doing?"
              autocomplete="off"
              required
            />
            <button class="add-button" type="submit">Add task</button>
          </div>
        </form>

        <section class="todo-section" aria-labelledby="todo-heading">
          <div class="list-heading">
            <h2 id="todo-heading">Tasks</h2>
            <p id="task-summary">0 tasks</p>
          </div>
          <p class="empty-state" id="empty-state">Your list is clear. Add a task to get started.</p>
          <ul class="todo-list" id="todo-list"></ul>
        </section>

        <p class="sr-only" id="status-message" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
