<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <header>
        <p class="eyebrow">Personal workspace</p>
        <h1>My tasks</h1>
        <p class="intro">Keep the next important thing in view.</p>
      </header>
      <form id="todo-form" class="add-task">
        <label for="todo-input">New task</label>
        <div class="input-row">
          <input id="todo-input" name="description" autocomplete="off" placeholder="What needs doing?" required />
          <button type="submit">Add task</button>
        </div>
      </form>
      <section aria-labelledby="tasks-heading">
        <div class="list-heading">
          <h2 id="tasks-heading">Todo</h2>
          <span id="task-count" aria-live="polite"></span>
        </div>
        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
