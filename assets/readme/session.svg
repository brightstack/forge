<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 537" width="870" height="537" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">Forge session: building a CSV export button, stopping after Verify</title>
<desc id="d">You ask Forge to build a CSV export button and stop after Verify. Forge proposes the flow and team, you approve the issue, Review finds a P1 that Repair fixes, Simplify and Verify pass, and Forge stops before Ship.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:14px;white-space:pre;fill:#a7a59a}.you{fill:#fee685;font-weight:700}.ut{fill:#f5f3ec}.fl{fill:#f5f3ec;font-weight:700}.ft{fill:#d4d1c6}.k{fill:#a7a59a}.q{fill:#f5f3ec}.ok{fill:#6fc087;font-weight:700}.no{fill:#ea5e59;font-weight:700}.r{animation:r .35s ease both}@keyframes r{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.r{animation:none}}</style>
