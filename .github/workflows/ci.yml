name: CI

# Runs the verification pipeline documented in AGENTS.md on every push and pull
# request, on both platforms the installer ships binaries for.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      # One platform failing should not hide the state of the other: src/lock.ts
      # branches on process.platform, so darwin and linux exercise different code.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. An unpinned runtime turns a Bun regression into a
          # mystery failure on an unrelated pull request; bump this in its own commit.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build the CLI
        run: bun run build:cli

      # FORGE_TEST_BINARY is load-bearing, not decoration: without it the two
      # standalone tests skip themselves and the suite still reports success, so a
      # job that omits it silently stops covering the compiled binary.
      - name: Test
        run: FORGE_TEST_BINARY="$PWD/dist/forge" bun test ./tests

      - name: Check whitespace
        run: git diff --check
