<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor deployments</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><strong>Harbor</strong> / Delivery</header>
  <main>
    <h1>Deployments</h1>
    <p>Recent releases across your environments.</p>
    <label for="environment">Environment</label>
    <select id="environment">
      <option value="all">All environments</option>
      <option value="production">Production</option>
      <option value="staging">Staging</option>
    </select>
    <ul id="deployments" aria-live="polite"></ul>
  </main>
  <script>
    const deployments = [
      { name: 'Checkout retry handling', environment: 'staging' },
      { name: 'Invoice delivery status', environment: 'staging' },
    ];
    const filter = document.querySelector('#environment');
    function render() {
      const visible = deployments.filter(item => filter.value === 'all' || item.environment === filter.value);
      document.querySelector('#deployments').replaceChildren(...visible.map(item => {
        const row = document.createElement('li');
        const name = document.createElement('strong');
        name.textContent = item.name;
        const environment = document.createElement('span');
        environment.textContent = 'Staging';
        row.append(name, environment);
        return row;
      }));
    }
    filter.addEventListener('change', render);
    render();
  </script>
</body>
</html>
